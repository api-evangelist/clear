aid: clear
name: CLEAR
description: >-
  CLEAR (clearme.com) is a secure identity company best known for its biometric
  identity network. For developers, CLEAR1 exposes an identity verification API:
  you create a verification session, hand the user off to CLEAR's hosted UI to
  capture a government ID and a selfie/liveness check, then retrieve the verified
  result and traits. The platform supports OAuth 2.0 / OpenID Connect (with PKCE)
  for end-user identity tokens, bearer-key auth for the REST API, webhooks for
  session lifecycle events, a sandbox with synthetic test identities, and
  native integrations (Okta, Microsoft Entra, Ping, Amazon Connect, DocuSign,
  Greenhouse) across workforce, healthcare, financial services, and consumer use
  cases, including IAL2 identity proofing and TEFCA/Carequality access.
