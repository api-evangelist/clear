arazzo: 1.0.1
info:
  title: CLEAR verify an identity
  version: 1.0.0
  description: Create a CLEAR verification session, then retrieve its result and verified traits.
  x-realizes-capability-ids:
  - BC-1300
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-1300
      capability_name: Banking Customer Management
      spec: clear-verification-sessions-api-openapi.yml
      confidence: 0.8
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: verificationSessionsApi
  url: ../openapi/clear-verification-sessions-api-openapi.yml
  type: openapi
workflows:
- workflowId: verifyIdentity
  summary: Create a verification session and retrieve the verified result
  inputs:
    type: object
    properties:
      project_id:
        type: string
      redirect_url:
        type: string
  steps:
  - stepId: createSession
    operationId: create_verification_session
    requestBody:
      contentType: application/json
      payload:
        project_id: $inputs.project_id
        redirect_url: $inputs.redirect_url
        sandbox: true
    outputs:
      sessionId: $response.body#/id
      token: $response.body#/token
  - stepId: getSession
    operationId: get_verification
    parameters:
    - name: id
      in: path
      value: $steps.createSession.outputs.sessionId
    outputs:
      status: $response.body#/status
      traits: $response.body#/traits
  outputs:
    status: $steps.getSession.outputs.status
