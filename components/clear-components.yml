- family: Web SDK
  type: javascript
  description: CLEAR Web SDK that wraps the verification experience in an existing web app; must be used unaltered per CLEAR security guidelines.
- family: Console
  type: hosted-dashboard
  loader: https://verified.clearme.com/dashboard
  description: Admin console for projects, API keys, OIDC clients, webhook configuration, and the verification table.
